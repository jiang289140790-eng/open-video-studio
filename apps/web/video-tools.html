<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>视频工具 | Luravyn</title>
    <meta name="description" content="浏览 Luravyn 图片转视频和视频特效工具。">
    <link rel="icon" type="image/png" href="./favicon.png">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./zh/app/"><img class="brand-wordmark" src="./brand/luravyn-logo.png" alt="Luravyn"></a>
      <nav class="topnav" aria-label="主导航"><a href="./zh/image-tools/">图像工具</a><a href="./zh/video-tools/" aria-current="page">视频工具</a><a href="./zh/pricing/">购买积分</a><a href="./zh/free-coins/">免费积分</a><a href="./zh/my-creations/">我的作品</a></nav>
      <nav class="accountnav" aria-label="账户导航"><a class="daily-check" href="./zh/free-coins/">每日奖励</a><a href="./zh/login/" data-auth-modal>登录</a></nav>
    </header>
    <main class="app-surface tool-category-page consumer-directory" data-consumer-tool-directory data-directory-type="video">
      <section class="consumer-directory__hero">
        <p data-directory-eyebrow></p>
        <h1 data-directory-title></h1>
        <p data-directory-description></p>
      </section>
      <section class="consumer-directory__toolbar" aria-label="视频工具筛选">
        <div data-directory-filters></div>
        <label><span>搜索工具</span><input type="search" data-directory-search placeholder="搜索视频工具"></label>
      </section>
      <section class="consumer-directory__content" aria-labelledby="directoryHeading">
        <div class="consumer-directory__heading"><div><span>工具目录</span><h2 id="directoryHeading">视频创作能力</h2></div><small>完成真实 MP4 验收后才开放创建</small></div>
        <div class="consumer-directory__grid" data-directory-grid></div>
        <div class="consumer-directory__empty" data-directory-empty hidden><strong>没有匹配的工具</strong><p>请调整分类或搜索关键词。</p></div>
      </section>
    </main>
    <script type="module" src="./tool-directory.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
