services:
  - type: web
    name: generation-gateway-staging
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./generation-gateway
    dockerfilePath: ./generation-gateway/Dockerfile
    autoDeployTrigger: commit
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: MOCK_PROVIDER_ENABLED
        value: "true"
      - key: MOCK_PROVIDER_LATENCY_MS
        value: "750"
      - key: MOCK_PROVIDER_FAILURE_RATE
        value: "0"
      - key: MOCK_PROVIDER_TIMEOUT_RATE
        value: "0"
      - key: REQUEST_BODY_LIMIT_BYTES
        value: "1048576"
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: WEBHOOK_SIGNING_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: RUNPOD_API_KEY
        sync: false
      - key: RUNPOD_ENDPOINT_ID
        sync: false
      - key: RUNPOD_WEBHOOK_SECRET
        sync: false
      - key: RUNPOD_REQUEST_TIMEOUT_MS
        sync: false
      - key: RUNPOD_POLL_INTERVAL_MS
        sync: false
      - key: RUNPOD_MAX_POLL_DURATION_MS
        sync: false
      - key: RUNPOD_COMFYUI_WORKFLOW_REF
        sync: false
      - key: RUNPOD_MODEL_MANIFEST_REF
        sync: false
      - key: GENERATION_STORAGE_BUCKET
        sync: false
      - key: REAL_PROVIDER_ENABLED
        sync: false
      - key: REAL_PROVIDER_ALLOWLIST
        sync: false
