<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>我的创作 | Luravyn</title>
    <link rel="icon" type="image/png" href="./favicon.png">
    <meta name="description" content="管理你的 Luravyn 图片、视频与生成任务。">
    <meta name="robots" content="noindex,follow">
    <meta name="theme-color" content="#111111">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./index.html"><img class="brand-wordmark" src="./brand/luravyn-logo.png" alt="Luravyn"></a>
      <nav class="topnav" aria-label="主导航">
        <a href="./zh/app/generate/">图像工具</a>
        <a href="./zh/app/image-to-video/">视频工具</a>
        <a href="./zh/pricing/">购买积分</a>
        <a href="./zh/free-coins/">免费积分</a>
        <a href="./zh/my-creations/" aria-current="page">我的作品</a>
      </nav>
      <nav class="accountnav" aria-label="账户导航">
        <a class="daily-check" href="./zh/free-coins/">每日奖励</a>
        <a href="./zh/login/">登录</a>
      </nav>
    </header>

    <div class="app-layout">
      <aside class="side-rail" aria-label="工具导航">
        <nav class="rail-menu" aria-label="工具菜单">
          <a class="side-link" href="./zh/app/">首页</a>
          <a class="side-link" href="./zh/app/spicy-effects/">辣味效果 <span class="badge-hot">HOT</span></a>
          <p class="side-label">AI 图像</p>
          <a class="side-link" href="./zh/app/image-editor/">图片编辑器</a>
          <a class="side-link" href="./zh/app/face-swap/">AI 换脸</a>
          <a class="side-link" href="./zh/app/outfit-studio/">性感礼服</a>
          <a class="side-link" href="./zh/app/pose-generator/">性爱姿势</a>
          <p class="side-label">AI 视频</p>
          <a class="side-link" href="./zh/app/image-to-video/">图片转视频</a>
          <a class="side-link active" href="./zh/my-creations/" aria-current="page">我的作品</a>
        </nav>
        <div class="rail-actions" aria-label="账户快捷入口">
          <a href="./zh/referral/">推荐好友</a>
          <a class="rail-upgrade" href="./zh/pricing/?from=sidebar">立即升级</a>
        </div>
      </aside>

      <main class="app-surface creations-page consumer-creations-page">
        <section class="consumer-creations-head">
          <div>
            <p class="eyebrow">我的作品</p>
            <h1>创作中心</h1>
            <p class="muted">查看生成中的任务，管理已完成的图片和视频。</p>
          </div>
          <div class="consumer-creations-head-actions">
            <a class="btn glass" href="./zh/app/">浏览工具</a>
            <a class="btn primary" href="./zh/app/generate/">开始创作</a>
          </div>
        </section>

        <section class="creation-toolbar consumer-creation-toolbar" aria-label="作品筛选">
          <label class="creation-search-field">
            <span class="sr-only">搜索作品</span>
            <input class="search" data-creation-search placeholder="搜索作品、工具或提示词">
          </label>
          <div class="gallery-tabs" role="group" aria-label="类型与状态">
            <button class="tab active" type="button" data-creation-filter="all">全部</button>
            <button class="tab" type="button" data-creation-filter="image">图片</button>
            <button class="tab" type="button" data-creation-filter="video">视频</button>
            <button class="tab" type="button" data-creation-filter="running">生成中</button>
            <button class="tab" type="button" data-creation-filter="failed">失败</button>
            <button class="tab" type="button" data-creation-filter="favorite">已收藏</button>
          </div>
          <label class="creation-privacy-filter">
            <span>可见性</span>
            <select data-creation-privacy>
              <option value="all">全部</option>
              <option value="private">私密</option>
              <option value="public">公开</option>
            </select>
          </label>
        </section>

        <section class="consumer-creations-content">
          <div class="consumer-creations-title">
            <div>
              <h2>作品与任务</h2>
              <p class="muted" data-creation-summary>登录后查看你的创作记录</p>
            </div>
            <button class="btn glass compact" type="button" data-refresh-creations>刷新</button>
          </div>
          <div class="creation-grid-dynamic consumer-creation-grid" data-creation-list></div>
        </section>

        <section class="creator-workspace-entry">
          <div>
            <p class="eyebrow">高级资产</p>
            <h2>需要角色、提示词、工作流或发布管理？</h2>
            <p class="muted">这些专业功能已从消费者作品首屏收起，仍可在独立工作台中使用。</p>
          </div>
          <a class="btn glass" href="./zh/dashboard/">进入创作者工作台</a>
        </section>
      </main>
    </div>

    <dialog class="creation-dialog" data-creation-preview-dialog>
      <button class="creation-dialog-close" type="button" data-close-creation-dialog aria-label="关闭">×</button>
      <div data-creation-preview-content></div>
    </dialog>

    <dialog class="creation-dialog creation-share-dialog" data-creation-share-dialog>
      <button class="creation-dialog-close" type="button" data-close-creation-dialog aria-label="关闭">×</button>
      <div data-creation-share-content></div>
    </dialog>

    <script type="module" src="./app.js"></script>
  </body>
</html>
